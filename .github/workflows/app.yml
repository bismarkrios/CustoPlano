# Gera o app de celular (Android e iPhone) para teste. Não publica nada nas lojas
# e não mexe no site: roda só na branch app-lojas.
name: App de celular

on:
  push:
    branches: [app-lojas]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Gerar APK de teste
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: custo-plano-android-teste
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para o simulador (sem assinatura)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  # Pacote assinado para o Google Play (.aab). Só roda quando os segredos da chave existem.
  android-loja:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.CP_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sem chave ainda
        if: env.TEM_CHAVE != 'true'
        run: echo "Chave de assinatura ainda não cadastrada nos segredos; pacote da loja não gerado."
      - run: npm ci
        if: env.TEM_CHAVE == 'true'
      - run: npx cap sync android
        if: env.TEM_CHAVE == 'true'
      - name: Gerar pacote assinado (.aab)
        if: env.TEM_CHAVE == 'true'
        env:
          CP_KEYSTORE_B64: ${{ secrets.CP_KEYSTORE_B64 }}
          CP_KEYSTORE_SENHA: ${{ secrets.CP_KEYSTORE_SENHA }}
          CP_KEY_ALIAS: ${{ secrets.CP_KEY_ALIAS }}
          CP_KEY_SENHA: ${{ secrets.CP_KEY_SENHA }}
          CP_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$CP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/loja.jks"
          export CP_KEYSTORE_FILE="$RUNNER_TEMP/loja.jks"
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.TEM_CHAVE == 'true'
        with:
          name: custo-plano-google-play
          path: app/android/app/build/outputs/bundle/release/app-release.aab
