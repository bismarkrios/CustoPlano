# Testa o sistema e publica sozinho.
#
# - Qualquer push em main: testa. O Render publica main automaticamente.
# - Push em uma branch claude/...: testa e, se passar, leva a mudança para
#   main, o que dispara a publicação no Render. Se o teste falhar, main não
#   muda e o site continua na versão anterior.
name: Testar e publicar

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custoplano
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install flask openpyxl

      - name: Verificar sintaxe
        run: python -m py_compile app.py banco.py cronograma.py

      - name: Garantir que nenhuma chave de API está no site (frontend)
        run: |
          if grep -rnEi "(api[_-]?key|apikey|secret[_-]?key|access[_-]?token|client[_-]?secret)[\"' ]*[:=]|sk-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abpr]-[A-Za-z0-9-]{10,}|rnd_[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY" web/; then
            echo "::error::Encontrei algo parecido com uma chave de API nos arquivos do site (web/). Chaves ficam só no servidor, em variáveis de ambiente."
            exit 1
          fi
          echo "nenhuma chave no frontend"

      - name: Testar se o site abre
        env:
          CP_BANCO: ${{ runner.temp }}/teste.db
          CP_SECRET: teste
        run: |
          python - <<'PY'
          import app
          c = app.app.test_client()
          r = c.get("/")
          assert r.status_code == 200, f"página inicial respondeu {r.status_code}"
          print("site OK")
          PY

      - name: Testar o isolamento entre contas (cada usuário só vê os próprios dados)
        env:
          CP_BANCO: ${{ runner.temp }}/isolamento.db
          CP_SECRET: teste
        run: python teste_isolamento.py

      - name: Testar a imagem Docker
        run: docker build -t custoplano .

      - name: Testar a leitura de .mpp na imagem (Java + MPXJ)
        run: |
          docker run -i --rm custoplano python - <<'PY'
          import contextlib, io, cronograma
          saida = io.StringIO()
          try:
              with contextlib.redirect_stdout(saida):
                  x = cronograma.mpp_para_xml(open("exemplo/cronograma_exemplo.xml", "rb").read())
              assert "<Project" in x
              print("leitor .mpp OK")
          except Exception as e:
              detalhe = (str(e) + " | " + saida.getvalue()).replace("\n", " ")[-1500:]
              print(f"::error::Leitor .mpp falhou: {detalhe}")
              raise SystemExit(1)
          PY

  levar-para-main:
    needs: testar
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Juntar a mudança em main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main

      # Garante a publicação mesmo se o Render não perceber o push.
      # Precisa do segredo RENDER_DEPLOY_HOOK (Render → Settings → Deploy Hook).
      - name: Avisar o Render para publicar
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "publicação pedida ao Render"
          else
            echo "segredo RENDER_DEPLOY_HOOK não configurado; dependendo do deploy automático do Render"
          fi

  publicar-main:
    needs: testar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar o Render para publicar
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "publicação pedida ao Render"
          else
            echo "segredo RENDER_DEPLOY_HOOK não configurado; dependendo do deploy automático do Render"
          fi
